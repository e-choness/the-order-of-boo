name: Haunting forecast

# Keeps the README alive: Halloween countdown, tonight's moon phase,
# a daily "haunting forecast" and a Boo field tip.
on:
  schedule:
    - cron: '13 0 * * *' # daily, 00:13 UTC — just after midnight, naturally
  workflow_dispatch:

permissions:
  contents: write

jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: node .github/scripts/haunt-forecast.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet README.md; then exit 0; fi
          git config user.name "boo-forecast[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: refresh the haunting forecast 🎃"
          git push
